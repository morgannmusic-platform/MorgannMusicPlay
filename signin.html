<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morgann Music - Inscription</title>
    <style>
        :root {
            --bg-primary: #FFF9F2;
            --bg-secondary: #FFF4DF;
            --accent-pink: #FF4FA0;
            --text-color: #222222;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-card {
            background-color: #ffffff;
            padding: 32px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 79, 160, 0.1);
        }

        h2 {
            margin-bottom: 24px;
            font-size: 1.5rem;
            text-align: center;
            color: var(--text-color);
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            background-color: var(--bg-secondary);
            font-size: 0.95rem;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-pink);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            border: none;
            transition: opacity 0.2s;
            margin-top: 8px;
        }

        .btn-primary {
            background-color: var(--accent-pink);
            color: #FFF9F2;
        }

        .btn-google {
            background-color: #ffffff;
            border: 1px solid #ddd;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
        }

        .btn:hover {
            opacity: 0.85;
        }

        .switch-page {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
        }

        .switch-page a {
            color: var(--accent-pink);
            text-decoration: none;
            font-weight: 600;
        }

        .error-msg {
            color: #d93838;
            font-size: 0.85rem;
            margin-bottom: 12px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="auth-card">
        <h2>Inscription</h2>
        <div id="error-container" class="error-msg"></div>

        <form id="signin-form">
            <div class="input-group">
                <label>Prénom</label>
                <input type="text" id="prenom" required placeholder="Ton prénom">
            </div>
            <div class="input-group">
                <label>Nom</label>
                <input type="text" id="nom" required placeholder="Ton nom">
            </div>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" required placeholder="nom@exemple.com">
            </div>
            <div class="input-group">
                <label>Mot de passe</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary">S'inscrire</button>
        </form>

        <button id="google-signin" class="btn btn-google">
            <svg width="18" height="18" viewBox="0 0 24 24">
                <path fill="#4285F4"
                    d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z" />
                <path fill="#34A853"
                    d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.19v3.15C3.17 21.32 7.23 24 12 24z" />
                <path fill="#FBBC05"
                    d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.19C.43 8.1 0 9.8 0 12s.43 3.9 1.19 5.42l4.09-3.15z" />
                <path fill="#EA4335"
                    d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.17 2.68 1.19 6.58l4.09 3.15c.95-2.83 3.6-4.98 6.72-4.98z" />
            </svg>
            S'inscrire avec Google
        </button>

        <div class="switch-page">
            Déjà un compte ? <a href="/login.html">Se connecter</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, updateProfile, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDSPUArpApBuK0Cn9VbeMtqk4JC-gqruJc",
            authDomain: "morgann-music-cp.firebaseapp.com",
            projectId: "morgann-music-cp",
            storageBucket: "morgann-music-cp.firebasestorage.app",
            messagingSenderId: "666812685196",
            appId: "1:666812685196:web:8973e1d62b28b90a8494a9",
            measurementId: "G-M0ZQQ2RZYZ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const errorContainer = document.getElementById("error-container");

        // Inscription Email/Password
        document.getElementById("signin-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            errorContainer.textContent = "";
            const prenom = document.getElementById("prenom").value;
            const nom = document.getElementById("nom").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                const userCred = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(userCred.user, { displayName: `${prenom} ${nom}` });
                handleSuccess(userCred.user, prenom, nom);
            } catch (err) {
                errorContainer.textContent = "Erreur : " + err.message;
            }
        });

        // Inscription/Connexion Google
        document.getElementById("google-signin").addEventListener("click", async () => {
            errorContainer.textContent = "";
            const provider = new GoogleAuthProvider();
            try {
                const userCred = await signInWithPopup(auth, provider);
                const names = userCred.user.displayName ? userCred.user.displayName.split(" ") : ["Utilisateur", ""];
                handleSuccess(userCred.user, names[0], names.slice(1).join(" "));
            } catch (err) {
                errorContainer.textContent = "Erreur Google : " + err.message;
            }
        });

        function handleSuccess(user, prenom, nom) {
            const userData = { prenom, nom, email: user.email };
            localStorage.setItem("mm_user", JSON.stringify(userData));

            if (window.opener) {
                window.opener.location.reload();
                window.close();
            } else {
                window.location.href = "/index.html";
            }
        }
    </script>
</body>

</html>
