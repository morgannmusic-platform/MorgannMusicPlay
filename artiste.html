<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artiste - Morgann Music CP</title>

    <!-- Balises Open Graph / Réseaux sociaux (mises à jour dynamiquement) -->
    <meta property="OG:TITLE" id="metaOgTitle" content="Artiste - Morgann Music CP">
    <meta property="OG:DESCRIPTION" id="metaOgDesc"
        content="Découvrez le profil, les liens et les dernières sorties de l'artiste sur Morgann Music CP.">
    <meta property="OG:IMAGE" id="metaOgImage" content="https://mm-cp.uk/assets/img/icons/sombre.png">
    <meta property="OG:TYPE" content="website">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" id="metaTwitterTitle" content="Artiste - Morgann Music CP">
    <meta name="twitter:description" id="metaTwitterDesc"
        content="Découvrez le profil, les liens et les dernières sorties de l'artiste sur Morgann Music CP.">
    <meta name="twitter:image" id="metaTwitterImage" content="https://mm-cp.uk/assets/img/icons/sombre.png">

    <!-- Emplacement d'injection du Schema.org -->
    <div id="schemaContainer"></div>

    <!-- Bibliothèque Color Thief -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.umd.js"></script>
    <!-- CSS de la sidebar -->
    <link rel="stylesheet" href="/assets/sidebar/sidebar.css">
    <!-- CSS du lecteur flottant -->
    <link rel="stylesheet" href="/assets/player/player.css">
    <style>
        :root {
            --bg-primary: #fce4ec;
            --accent-dynamic: #121212;
            --text-primary: #121212;
            --hero-text: #121212;
            --hero-text-secondary: #333333;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
            transition: background-color 0.8s ease, color 0.8s ease;
        }

        .main-content {
            margin-left: 260px;
            flex: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding-bottom: 150px;
            transition: margin-left 0.3s ease;
        }

        .page-wrapper {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .header-section {
            width: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 1. Cas AVEC bannière sur Ordi : Bannière fondu */
        .banner-wrapper {
            width: 100%;
            height: 500px;
            position: relative;
            overflow: hidden;
        }

        .banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.95);
            will-change: filter;
            transition: filter 0.1s ease-out;
            -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 1) 65%, rgba(0, 0, 0, 0) 100%);
            mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 1) 65%, rgba(0, 0, 0, 0) 100%);
        }

        .banner-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 20px;
            pointer-events: none;
        }

        /* 2. Cas SANS bannière sur Ordi : Photo de profil en rond au centre */
        .profile-hero-section {
            width: 100%;
            padding: 60px 20px 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            text-align: center;
        }

        .profile-avatar-wrapper {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 4px solid rgba(255, 255, 255, 0.8);
            background-color: #ddd;
        }

        .profile-avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .artist-title-container {
            position: relative;
            text-align: center;
            z-index: 10;
            pointer-events: auto;
        }

        .artist-name-blurred {
            font-size: 3.2rem;
            font-weight: 800;
            color: var(--hero-text);
            position: relative;
            padding: 5px 20px;
            display: inline-block;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            transition: color 0.5s ease;
        }

        .artist-name-blurred::before {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            filter: blur(8px);
            background: rgba(0, 0, 0, 0.5);
            border-radius: 12px;
        }

        .artist-name-plain {
            font-size: 2.8rem;
            font-weight: 800;
            color: var(--hero-text);
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.5);
            transition: color 0.5s ease;
        }

        .artist-logo {
            max-height: 130px;
            max-width: 400px;
            object-fit: contain;
            filter: drop-shadow(0 6px 15px rgba(0, 0, 0, 0.5));
            z-index: 1000000;
        }

        .content-section {
            padding: 30px 20px 50px 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 100%;
            max-width: 700px;
            position: relative;
            z-index: 1;
        }

        .artist-info-card {
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .artist-genres {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .genre-tag {
            background-color: #121212;
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .artist-bio {
            font-size: 0.95rem;
            color: #333333;
            line-height: 1.5;
        }

        .main-links-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
        }

        .platform-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 18px;
            background-color: rgba(255, 255, 255, 0.9);
            color: #121212;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .platform-btn:hover {
            background-color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .latest-release-card {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.5);
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            text-decoration: none;
            transition: transform 0.2s ease, background-color 0.2s ease;
            cursor: pointer;
        }

        .latest-release-card:hover {
            transform: translateY(-3px);
            background-color: #ffffff;
        }

        .latest-header {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #333333;
            padding: 15px 20px 0 20px;
            font-weight: 800;
        }

        .latest-body {
            display: flex;
            padding: 15px 20px 20px 20px;
            gap: 20px;
            align-items: center;
        }

        .latest-cover {
            width: 110px;
            height: 110px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
            background-color: #ddd;
        }

        .latest-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow: hidden;
        }

        .latest-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: #121212;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .latest-artist {
            font-size: 0.95rem;
            color: #333333;
            font-weight: 600;
        }

        .latest-btn {
            display: inline-block;
            margin-top: 8px;
            padding: 8px 18px;
            background-color: #121212;
            color: #ffffff;
            text-decoration: none;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            align-self: flex-start;
            transition: background 0.2s;
        }

        .latest-btn:hover {
            background-color: #333333;
        }

        /* Styles Discographie Séparée */
        .discography-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 800;
            color: #333333;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .discography-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            width: 100%;
        }

        .release-item-card {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.5);
            display: flex;
            flex-direction: column;
            text-decoration: none;
            transition: transform 0.2s ease, background-color 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .release-item-card:hover {
            transform: translateY(-3px);
            background-color: #ffffff;
        }

        .release-item-cover {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            background-color: #ddd;
        }

        .release-item-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .release-item-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #121212;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .release-item-type {
            font-size: 0.75rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .back-home-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 10px;
            margin-bottom: 30px;
        }

        .back-home-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 28px;
            background-color: rgba(18, 18, 18, 0.85);
            color: #ffffff;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
        }

        .back-home-btn:hover {
            background-color: #121212;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
        }

        .back-home-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .hidden {
            display: none !important;
        }

        /* 3. Sur Téléphone : Si pas de bannière, la PDP se transforme en bannière avec fondu */
        @media (max-width: 768px) {
            .main-content {
                margin-left: 0;
                padding-bottom: 160px;
            }

            .mobile-pdp-banner {
                width: 100%;
                height: 380px;
                position: relative;
                overflow: hidden;
            }

            .mobile-pdp-img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                filter: brightness(0.95);
                -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 1) 65%, rgba(0, 0, 0, 0) 100%);
                mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 1) 65%, rgba(0, 0, 0, 0) 100%);
            }

            .mobile-pdp-overlay {
                position: absolute;
                bottom: 0;
                left: 0;
                width: 100%;
                height: 150px;
                display: flex;
                align-items: flex-end;
                justify-content: center;
                padding-bottom: 20px;
            }

            .banner-wrapper {
                height: 380px;
            }

            .artist-name-blurred {
                font-size: 2.3rem;
            }

            .artist-logo {
                max-height: 100px;
                max-width: 280px;
            }

            .latest-body {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .latest-info {
                align-items: center;
            }

            .latest-btn {
                align-self: center;
            }
        }
    </style>
</head>

<body>

    <div id="sidebar-container"></div>
    <div id="player-container"></div>

    <div class="main-content">
        <div class="page-wrapper">
            <div id="headerSectionContainer" style="width: 100%;"></div>

            <div class="content-section">
                <div class="artist-info-card hidden" id="artistInfoCard">
                    <div class="artist-genres" id="artistGenresList"></div>
                    <div class="artist-bio hidden" id="artistBio"></div>
                </div>

                <div class="main-links-grid" id="mainLinksGrid"></div>

                <a href="#" class="latest-release-card hidden" id="latestReleaseCard">
                    <div class="latest-header">Dernière sortie</div>
                    <div class="latest-body">
                        <img id="latestCover" src="" alt="Cover" class="latest-cover">
                        <div class="latest-info">
                            <div class="latest-title" id="latestTitle">Titre</div>
                            <div class="latest-artist" id="latestArtist">Artiste</div>
                            <span class="latest-btn">Écouter</span>
                        </div>
                    </div>
                </a>

                <!-- Discographie : Albums -->
                <div class="discography-section hidden" id="albumsSection">
                    <div class="section-title">Albums</div>
                    <div class="discography-grid" id="albumsGrid"></div>
                </div>

                <!-- Discographie : Singles & EPs -->
                <div class="discography-section hidden" id="singlesSection">
                    <div class="section-title">Singles & EPs</div>
                    <div class="discography-grid" id="singlesGrid"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/assets/sidebar/sidebar.js"></script>
    <script src="/assets/player/player.js"></script>

    <script>
        const API_BASE = "https://api.worker.mm-cp.uk";

        function resolveImageUrl(url) {
            if (!url) return '';
            if (url.includes('/api/proxy-download')) {
                return url;
            }
            if (url.startsWith('http://') || url.startsWith('https://')) {
                if (url.includes('stock.mm-cp.uk')) {
                    return `${API_BASE}/api/proxy-download?url=${encodeURIComponent(url)}`;
                }
                if (url.includes(API_BASE)) {
                    return url;
                }
                return `${API_BASE}/api/proxy-download?url=${encodeURIComponent(url)}`;
            }
            const cleanPath = url.startsWith('/') ? url : '/' + url;
            return `${API_BASE}${cleanPath.startsWith('/api/') ? cleanPath : '/api/files' + cleanPath}`;
        }

        async function loadArtistPage() {
            const urlParams = new URLSearchParams(window.location.search);
            const artistId = urlParams.get('id') || urlParams.get('artiste') || urlParams.get('name');
            const artistSlug = urlParams.get('slug');

            try {
                const [artistsRes, releasesRes] = await Promise.all([
                    fetch(`${API_BASE}/api/artists`).then(r => r.json()).catch(() => ({ artists: [] })),
                    fetch(`${API_BASE}/api/releases`).then(r => r.json()).catch(() => ({ releases: [] }))
                ]);

                const artists = artistsRes.artists || [];
                const releases = releasesRes.releases || [];

                let artist = null;
                if (artistId) {
                    artist = artists.find(a => String(a.id) === String(artistId) || (a.name && a.name.toLowerCase() === decodeURIComponent(artistId).toLowerCase()));
                }
                if (!artist && artistSlug) {
                    artist = artists.find(a => a.name && a.name.toLowerCase().replace(/[^a-z0-9-_]/g, '-') === artistSlug.toLowerCase());
                }
                if (!artist && artists.length > 0) {
                    artist = artists[0];
                }

                if (!artist) {
                    document.querySelector('.page-wrapper').innerHTML = '<div style="padding: 50px; text-align: center; color: #121212;">Artiste introuvable.</div>';
                    return;
                }

                renderArtist(artist, releases);

            } catch (err) {
                console.error("Erreur de chargement de la page artiste :", err);
                document.querySelector('.page-wrapper').innerHTML = '<div style="padding: 50px; text-align: center; color: #121212;">Erreur lors du chargement des données.</div>';
            }
        }

        function renderArtist(artist, allReleases) {
            const headerContainer = document.getElementById('headerSectionContainer');
            const name = artist.name || "Artiste";
            const bannerUrl = resolveImageUrl(artist.bannerUrl || artist.banner_url || "");
            const photoUrl = resolveImageUrl(artist.photo || artist.photoUrl || artist.photo_url || "");
            const logoUrl = resolveImageUrl(artist.logoUrl || artist.logo_url || "");

            // --- MISE À JOUR DYNAMIQUE DES MÉTADONNÉES DE PARTAGE ---
            document.title = `${name} - Morgann Music CP`;

            const shareDesc = artist.description ? artist.description.substring(0, 150) + '...' : `Découvrez le profil et les musiques de ${name} sur Morgann Music CP.`;
            const shareImage = photoUrl || bannerUrl || 'https://mm-cp.uk/assets/img/icons/sombre.png';

            document.getElementById('metaOgTitle').setAttribute('content', `${name} - Morgann Music CP`);
            document.getElementById('metaOgDesc').setAttribute('content', shareDesc);
            document.getElementById('metaOgImage').setAttribute('content', shareImage);

            document.getElementById('metaTwitterTitle').setAttribute('content', `${name} - Morgann Music CP`);
            document.getElementById('metaTwitterDesc').setAttribute('content', shareDesc);
            document.getElementById('metaTwitterImage').setAttribute('content', shareImage);

            // INJECTION DIRECTE DU SCHEMA JSON-LD DEPUIS LA COLONNE schema_json DE LA TABLE artists
            const schemaContainer = document.getElementById('schemaContainer');
            const customSchema = artist.schema_json || artist.schemaJson;

            if (customSchema && typeof customSchema === 'string') {
                if (customSchema.includes('<script')) {
                    schemaContainer.innerHTML = customSchema;
                } else {
                    const scriptTag = document.createElement('script');
                    scriptTag.type = 'application/ld+json';
                    scriptTag.textContent = customSchema;
                    schemaContainer.appendChild(scriptTag);
                }
            } else if (customSchema && typeof customSchema === 'object') {
                const scriptTag = document.createElement('script');
                scriptTag.type = 'application/ld+json';
                scriptTag.textContent = JSON.stringify(customSchema, null, 2);
                schemaContainer.appendChild(scriptTag);
            } else {
                const defaultSchema = {
                    "@context": "https://schema.org",
                    "@type": "MusicGroup",
                    "name": name,
                    "url": window.location.href,
                    "image": shareImage,
                    "description": shareDesc
                };
                const scriptTag = document.createElement('script');
                scriptTag.type = 'application/ld+json';
                scriptTag.textContent = JSON.stringify(defaultSchema, null, 2);
                schemaContainer.appendChild(scriptTag);
            }
            // -----------------------------------------------------------------------------

            const useBanner = Boolean(bannerUrl);
            const isMobile = window.innerWidth <= 768;

            if (useBanner) {
                const proxyBannerUrl = resolveImageUrl(bannerUrl);

                headerContainer.innerHTML = `
                    <div class="banner-wrapper" id="headerWrapper">
                        <img src="${proxyBannerUrl}" alt="${name}" class="banner-img" id="headerImg" crossorigin="anonymous">
                        <div class="banner-overlay" id="bannerOverlay">
                            <div class="artist-title-container" id="titleContainer">
                                ${logoUrl ? `<img src="${logoUrl}" alt="${name}" class="artist-logo">` : `<h1 class="artist-name-blurred" data-text="${name}">${name}</h1>`}
                            </div>
                        </div>
                    </div>
                `;

                setupColorThief(proxyBannerUrl);
            } else {
                const defaultPhoto = 'https://mm-cp.uk/assets/img/icons/sombre.png';
                const finalPhotoUrl = photoUrl || defaultPhoto;

                if (isMobile) {
                    headerContainer.innerHTML = `
                        <div class="mobile-pdp-banner">
                            <img src="${finalPhotoUrl}" alt="${name}" class="mobile-pdp-img" id="headerImg" crossorigin="anonymous" onerror="this.src='${defaultPhoto}'">
                            <div class="mobile-pdp-overlay">
                                <div class="artist-title-container">
                                    ${logoUrl ? `<img src="${logoUrl}" alt="${name}" class="artist-logo">` : `<h1 class="artist-name-blurred" data-text="${name}">${name}</h1>`}
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    headerContainer.innerHTML = `
                        <div class="profile-hero-section">
                            <div class="profile-avatar-wrapper">
                                <img src="${finalPhotoUrl}" alt="${name}" class="profile-avatar-img" id="headerImg" crossorigin="anonymous" onerror="this.src='${defaultPhoto}'">
                            </div>
                            <div class="artist-title-container">
                                ${logoUrl ? `<img src="${logoUrl}" alt="${name}" class="artist-logo">` : `<h1 class="artist-name-plain">${name}</h1>`}
                            </div>
                        </div>
                    `;
                }

                setupColorThief(finalPhotoUrl);
            }

            const primaryGenre = artist.primaryGenre || artist.genre || "";
            const secondaryGenre = artist.secondaryGenre || "";
            const description = artist.description || "";
            const genresList = document.getElementById('artistGenresList');
            const bioElement = document.getElementById('artistBio');
            const infoCard = document.getElementById('artistInfoCard');
            let hasInfo = false;

            let genresHtml = '';
            if (primaryGenre) {
                genresHtml += `<span class="genre-tag">${primaryGenre}</span>`;
                hasInfo = true;
            }
            if (secondaryGenre) {
                genresHtml += `<span class="genre-tag">${secondaryGenre}</span>`;
                hasInfo = true;
            }

            if (genresHtml) {
                genresList.innerHTML = genresHtml;
                genresList.classList.remove('hidden');
            }

            if (description) {
                bioElement.innerText = description;
                bioElement.classList.remove('hidden');
                hasInfo = true;
            }

            if (hasInfo) {
                infoCard.classList.remove('hidden');
            }

            const mainGrid = document.getElementById('mainLinksGrid');
            const mainLinks = [];

            const artistLinkId = artist.id || artist._id || '';
            mainLinks.push(`<a href="https://link.morgannmusic.uk/artiste?id=${artistLinkId}" target="_blank" class="platform-btn">
                <img src="https://link.morgannmusic.uk/logo%20linkkkkkk%201.png" alt="Link" style="width: 20px; height: 20px; object-fit: contain; border-radius: 4px;">
                Morgann Link
            </a>`);

            if (mainLinks.length > 0) {
                mainGrid.innerHTML = mainLinks.join('');
            } else {
                mainGrid.classList.add('hidden');
            }

            const artistReleases = allReleases.filter(r =>
                (r.artistName && r.artistName.toLowerCase() === name.toLowerCase()) ||
                (r.artist_name && r.artist_name.toLowerCase() === name.toLowerCase())
            );

            // Gestion de la dernière sortie
            const latest = artistReleases.length > 0 ? artistReleases[0] : (allReleases.length > 0 ? allReleases[0] : null);

            if (latest) {
                const coverRaw = latest.coverUrl || latest.cover_url || '';
                document.getElementById('latestCover').src = resolveImageUrl(coverRaw);
                document.getElementById('latestTitle').innerText = latest.title || "Titre récent";
                document.getElementById('latestArtist').innerText = latest.artistName || latest.artist_name || name;

                const releaseId = latest.id || latest._id || '';
                document.getElementById('latestReleaseCard').href = `sortie.html?id=${releaseId}`;
                document.getElementById('latestReleaseCard').classList.remove('hidden');
            }

            // Gestion Discographie : Séparation Albums et Singles/EPs
            const albumsSection = document.getElementById('albumsSection');
            const albumsGrid = document.getElementById('albumsGrid');
            const singlesSection = document.getElementById('singlesSection');
            const singlesGrid = document.getElementById('singlesGrid');

            const albums = [];
            const singlesEps = [];

            artistReleases.forEach(r => {
                const type = (r.type || r.releaseType || r.format || '').toLowerCase();
                if (type.includes('album') || type === 'lp') {
                    albums.push(r);
                } else {
                    singlesEps.push(r);
                }
            });

            if (albums.length > 0) {
                albumsGrid.innerHTML = albums.map(r => {
                    const cover = resolveImageUrl(r.coverUrl || r.cover_url || '');
                    const title = r.title || 'Album';
                    const relId = r.id || r._id || '';
                    const rType = r.type || r.releaseType || 'Album';
                    return `
                        <a href="sortie.html?id=${relId}" class="release-item-card">
                            <img src="${cover}" alt="${title}" class="release-item-cover" loading="lazy">
                            <div class="release-item-info">
                                <div class="release-item-title" title="${title}">${title}</div>
                                <div class="release-item-type">${rType}</div>
                            </div>
                        </a>
                    `;
                }).join('');
                albumsSection.classList.remove('hidden');
            }

            if (singlesEps.length > 0) {
                singlesGrid.innerHTML = singlesEps.map(r => {
                    const cover = resolveImageUrl(r.coverUrl || r.cover_url || '');
                    const title = r.title || 'Single';
                    const relId = r.id || r._id || '';
                    const rType = r.type || r.releaseType || 'Single / EP';
                    return `
                        <a href="sortie.html?id=${relId}" class="release-item-card">
                            <img src="${cover}" alt="${title}" class="release-item-cover" loading="lazy">
                            <div class="release-item-info">
                                <div class="release-item-title" title="${title}">${title}</div>
                                <div class="release-item-type">${rType}</div>
                            </div>
                        </a>
                    `;
                }).join('');
                singlesSection.classList.remove('hidden');
            }
        }

        function setupColorThief(imageUrl) {
            const thiefImg = new Image();
            thiefImg.crossOrigin = "anonymous";

            let finalThiefUrl = imageUrl;
            if (imageUrl.includes('stock.mm-cp.uk') && !imageUrl.includes(API_BASE) && !imageUrl.includes('/api/proxy-download')) {
                finalThiefUrl = `${API_BASE}/api/proxy-download?url=${encodeURIComponent(imageUrl)}`;
            }

            thiefImg.src = finalThiefUrl;
            thiefImg.onload = function () {
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = thiefImg.naturalWidth || thiefImg.width || 300;
                    canvas.height = thiefImg.naturalHeight || thiefImg.height || 300;
                    const ctx = canvas.getContext('2d', { willReadFrequently: true });
                    ctx.drawImage(thiefImg, 0, 0, canvas.width, canvas.height);

                    const w = canvas.width;
                    const h = canvas.height;
                    const sampleStep = Math.max(1, Math.floor(w / 20));
                    let darkEdgeCount = 0;
                    let totalEdgeCount = 0;

                    const isDark = (r, g, b) => r < 35 && g < 35 && b < 35;
                    const marginX = Math.floor(w * 0.12);
                    const marginY = Math.floor(h * 0.12);

                    for (let x = 0; x < w; x += sampleStep) {
                        for (let y = 0; y < marginY; y += sampleStep) {
                            const p = ctx.getImageData(x, y, 1, 1).data;
                            totalEdgeCount++;
                            if (isDark(p[0], p[1], p[2])) darkEdgeCount++;
                        }
                        for (let y = h - marginY; y < h; y += sampleStep) {
                            const p = ctx.getImageData(x, y, 1, 1).data;
                            totalEdgeCount++;
                            if (isDark(p[0], p[1], p[2])) darkEdgeCount++;
                        }
                    }
                    for (let y = 0; y < h; y += sampleStep) {
                        for (let x = 0; x < marginX; x += sampleStep) {
                            const p = ctx.getImageData(x, y, 1, 1).data;
                            totalEdgeCount++;
                            if (isDark(p[0], p[1], p[2])) darkEdgeCount++;
                        }
                        for (let x = w - marginX; x < w; x += sampleStep) {
                            const p = ctx.getImageData(x, y, 1, 1).data;
                            totalEdgeCount++;
                            if (isDark(p[0], p[1], p[2])) darkEdgeCount++;
                        }
                    }

                    const edgeBlackRatio = totalEdgeCount > 0 ? (darkEdgeCount / totalEdgeCount) : 0;
                    const hasWideBlackBorders = edgeBlackRatio > 0.55;

                    const colorThief = new ColorThief();
                    const palette = colorThief.getPalette(canvas, 2);
                    if (palette && palette.length > 0) {
                        const [r, g, b] = palette[0];
                        const accentColor = `rgb(${r}, ${g}, ${b})`;

                        const solidColor = hasWideBlackBorders ? '#000000' : `rgb(${r}, ${g}, ${b})`;
                        document.documentElement.style.setProperty('--accent-dynamic', accentColor);
                        document.body.style.backgroundColor = solidColor;

                        if (hasWideBlackBorders) {
                            document.documentElement.style.setProperty('--hero-text', '#ffffff');
                            document.documentElement.style.setProperty('--hero-text-secondary', 'rgba(255, 255, 255, 0.85)');
                        } else {
                            const luminance = 0.299 * r + 0.587 * g + 0.114 * b;
                            if (luminance < 128) {
                                document.documentElement.style.setProperty('--hero-text', '#ffffff');
                                document.documentElement.style.setProperty('--hero-text-secondary', 'rgba(255, 255, 255, 0.85)');
                            } else {
                                document.documentElement.style.setProperty('--hero-text', '#121212');
                                document.documentElement.style.setProperty('--hero-text-secondary', '#333333');
                            }
                        }

                        let dynamicStyleTag = document.getElementById('dynamic-sidebar-style');
                        if (!dynamicStyleTag) {
                            dynamicStyleTag = document.createElement('style');
                            dynamicStyleTag.id = 'dynamic-sidebar-style';
                            document.head.appendChild(dynamicStyleTag);
                        }
                        dynamicStyleTag.innerHTML = `
                            .sidebar {
                                background: #ffffff !important;
                            }
                            .sidebar a, .sidebar .nav-item {
                                color: #1d1d1f !important;
                            }
                            .sidebar a.active, .sidebar .nav-item.active {
                                background-color: rgba(${r}, ${g}, ${b}, 0.15) !important;
                                color: ${accentColor} !important;
                            }
                            .sidebar a:hover, .sidebar .nav-item:hover {
                                background-color: rgba(0, 0, 0, 0.04) !important;
                                color: ${accentColor} !important;
                            }
                        `;
                    }
                } catch (e) {
                    console.log("Color Thief / Analyse des bords ignorée :", e);
                }
            };
        }

        window.addEventListener('DOMContentLoaded', loadArtistPage);
    </script>
