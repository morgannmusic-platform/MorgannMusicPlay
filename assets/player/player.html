<div class="floating-player">
    <div class="player-track-info">
        <img id="player-cover" src="/assets/img/icon/logo.svg" alt="Cover">
        <div class="player-text">
            <span id="player-title">Aucune lecture</span>
            <span id="player-artist">Morgann Music Play</span>
        </div>
    </div>
    <div class="player-controls">
        <button id="player-prev" title="Précédent">⏮</button>
        <button id="player-toggle" title="Lecture/Pause">▶</button>
        <button id="player-next" title="Suivant">⏭</button>
    </div>
    <audio id="audio-element"></audio>
</div>
