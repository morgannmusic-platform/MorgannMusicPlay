<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morgann Music Play - Nouveautés</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/assets/img/icon/apple-touch-icon.png">

    <link rel="stylesheet" href="/assets/sidebar/sidebar.css">
    <!-- CSS du lecteur flottant -->
    <link rel="stylesheet" href="/assets/player/player.css">
    <style>
        :root {
            --bg-primary: #FFF9F2;
            --bg-secondary: #FFF4DF;
            --accent-pink: #FF4FA0;
            --text-primary: #1d1d1f;
            --text-secondary: #6e6e73;
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(255, 79, 160, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 50px 40px;
            background: linear-gradient(145deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            padding-bottom: 140px;
            transition: margin-left 0.3s ease;
        }

        h1 {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-bottom: 30px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-top: 45px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            padding-bottom: 10px;
        }

        .section-header:first-of-type {
            margin-top: 0;
        }

        h2 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text-primary);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 22px;
        }

        /* Cartes ultra dynamiques style Apple Music */
        .card {
            background-color: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--card-border);
            transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 20px 40px rgba(255, 79, 160, 0.18);
            border-color: var(--accent-pink);
        }

        .card-img-wrapper {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 12px;
            background-color: #eaeaea;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
            position: relative;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .card:hover img {
            transform: scale(1.06);
        }

        .card-title {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-primary);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            font-size: 0.75rem;
        }

        .card-date {
            color: var(--accent-pink);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        /* Style spécifique pour les artistes (avatars ronds) */
        .card.artist-card .card-img-wrapper {
            border-radius: 50%;
        }

        .card.artist-card {
            text-align: center;
        }

        .loading-text,
        .error-text {
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-weight: 500;
            grid-column: 1 / -1;
            padding: 15px 0;
            font-style: italic;
        }

        /* Adaptations pour mobile */
        @media (max-width: 768px) {
            .main-content {
                margin-left: 0;
                padding: 70px 16px 160px 16px;
            }

            h1 {
                font-size: 1.8rem;
                margin-bottom: 20px;
            }

            .section-header {
                margin-top: 30px;
                margin-bottom: 14px;
            }

            h2 {
                font-size: 1.25rem;
            }

            .grid-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .card {
                padding: 10px;
                border-radius: 14px;
            }

            .card-title {
                font-size: 0.88rem;
            }

            .card-subtitle {
                font-size: 0.78rem;
            }

            .card-meta {
                font-size: 0.7rem;
            }
        }

        @media (max-width: 380px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div id="sidebar-container"></div>
    <div id="player-container"></div>

    <main class="main-content">
        <h1>Nouveautés</h1>

        <div class="section-header">
            <h2>🔥 Dernières Sorties</h2>
        </div>
        <div id="releases-direct-grid" class="grid-container">
            <span class="loading-text">Chargement des dernières sorties...</span>
        </div>

        <div class="section-header">
            <h2>⏳ Prochainement</h2>
        </div>
        <div id="releases-delivered-grid" class="grid-container">
            <span class="loading-text">Chargement des prochaines sorties...</span>
        </div>

        <div class="section-header">
            <h2>⭐ Artistes en vedette</h2>
        </div>
        <div id="artists-grid" class="grid-container">
            <span class="loading-text">Chargement des artistes...</span>
        </div>
    </main>

    <script src="/assets/sidebar/sidebar.js"></script>
    <script src="/assets/player/player.js"></script>

    <script>
        const API_WORKER = "https://api.worker.mm-cp.uk";

        // Résout proprement les URL des pochettes (absolues ou stockées sur le Worker R2)
        function getMediaUrl(url) {
            if (!url) return '/assets/img/icon/logo.svg';
            if (url.startsWith('http://') || url.startsWith('https://')) return url;
            const cleanPath = url.startsWith('/') ? url.slice(1) : url;
            return `${API_WORKER}/api/files/${cleanPath}`;
        }

        async function loadData() {
            try {
                const [releasesRes, artistsRes] = await Promise.all([
                    fetch(`${API_WORKER}/api/releases`).then(res => res.json()),
                    fetch(`${API_WORKER}/api/artists`).then(res => res.json())
                ]);

                const releases = releasesRes.releases || releasesRes || [];
                const artists = artistsRes.artists || artistsRes || [];

                // 1. Dernières sorties (statut "direct") triées par date décroissante
                const directReleases = releases
                    .filter(rel => (rel.status || "").toLowerCase() === "direct")
                    .sort((a, b) => new Date(b.releaseDate || 0) - new Date(a.releaseDate || 0))
                    .slice(0, 12);

                const directGrid = document.getElementById("releases-direct-grid");

                if (directReleases.length === 0) {
                    directGrid.innerHTML = `<p class="error-text">Aucune sortie disponible.</p>`;
                } else {
                    directGrid.innerHTML = directReleases.map(rel => `
                        <div class="card" onclick="window.location.href='sortie.html?id=${rel.id}'">
                            <div class="card-img-wrapper">
                                <img src="${getMediaUrl(rel.coverUrl)}" alt="${rel.title}" loading="lazy">
                            </div>
                            <div class="card-title" title="${rel.title}">${rel.title}</div>
                            <div class="card-subtitle" title="${rel.artistName}">${rel.artistName || 'Artiste inconnu'}</div>
                            <div class="card-meta">
                                <span class="card-date">📅 ${rel.releaseDate || 'Récent'}</span>
                            </div>
                        </div>
                    `).join("");
                }

                // 2. Prochainement (statut "livrée" ou "livree") triées par date croissante
                const deliveredReleases = releases
                    .filter(rel => {
                        const status = (rel.status || "").toLowerCase();
                        return status === "livrée" || status === "livree";
                    })
                    .sort((a, b) => new Date(a.releaseDate || 0) - new Date(b.releaseDate || 0));

                const deliveredGrid = document.getElementById("releases-delivered-grid");

                if (deliveredReleases.length === 0) {
                    deliveredGrid.innerHTML = `<p class="error-text">Aucune sortie prévue pour l'instant.</p>`;
                } else {
                    deliveredGrid.innerHTML = deliveredReleases.map(rel => `
                        <div class="card" onclick="window.location.href='sortie.html?id=${rel.id}'">
                            <div class="card-img-wrapper">
                                <img src="${getMediaUrl(rel.coverUrl)}" alt="${rel.title}" loading="lazy">
                            </div>
                            <div class="card-title" title="${rel.title}">${rel.title}</div>
                            <div class="card-subtitle" title="${rel.artistName}">${rel.artistName || 'Artiste inconnu'}</div>
                            <div class="card-meta">
                                <span class="card-date" style="color: #d48806;">🚀 Prévu le : ${rel.releaseDate || 'Bientôt'}</span>
                            </div>
                        </div>
                    `).join("");
                }

                // 3. Artistes en vedette (uniquement ceux ayant au moins une sortie "direct" affichée)
                const activeArtistNames = new Set(directReleases.map(rel => (rel.artistName || "").trim().toLowerCase()));
                const filteredArtists = artists.filter(art => activeArtistNames.has((art.name || "").trim().toLowerCase()));
                const artistsGrid = document.getElementById("artists-grid");

                if (filteredArtists.length === 0) {
                    artistsGrid.innerHTML = `<p class="error-text">Aucun artiste en vedette pour l'instant.</p>`;
                } else {
                    artistsGrid.innerHTML = filteredArtists.map(art => `
                        <div class="card artist-card" onclick="window.location.href='artiste.html?id=${art.id || encodeURIComponent(art.name)}'">
                            <div class="card-img-wrapper">
                                <img src="${getMediaUrl(art.photo || art.logoUrl)}" alt="${art.name}" loading="lazy">
                            </div>
                            <div class="card-title" title="${art.name}">${art.name}</div>
                            <div class="card-subtitle">${art.primaryGenre || 'Musique'}</div>
                        </div>
                    `).join("");
                }

            } catch (err) {
                console.error("Erreur de chargement :", err);
                document.getElementById("releases-direct-grid").innerHTML = `<p class="error-text">Impossible de charger les sorties.</p>`;
                document.getElementById("releases-delivered-grid").innerHTML = `<p class="error-text">Impossible de charger les prochaines sorties.</p>`;
                document.getElementById("artists-grid").innerHTML = `<p class="error-text">Impossible de charger les artistes.</p>`;
            }
        }

        loadData();
    </script>
</body>

</html>
