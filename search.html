<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recherche - Morgann Music CP</title>
    <!-- CSS de la sidebar -->
    <link rel="stylesheet" href="/assets/sidebar/sidebar.css">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- CSS du lecteur flottant -->
    <link rel="stylesheet" href="/assets/player/player.css">
    <style>
        :root {
            --bg-primary: #FFF9F2;
            --bg-secondary: #FFF4DF;
            --accent-pink: #FF4FA0;
            --text-primary: #1d1d1f;
            --text-secondary: #6e6e73;
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(255, 79, 160, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 90px 40px;
            background: linear-gradient(145deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            padding-bottom: 140px;
            transition: margin-left 0.3s ease;
        }

        h1 {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-bottom: 25px;
        }

        /* Barre de recherche style Apple Music */
        .search-bar-container {
            position: relative;
            margin-bottom: 30px;
        }

        .search-input {
            width: 100%;
            padding: 18px 22px 18px 52px;
            font-size: 1.1rem;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: var(--text-primary);
            outline: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--accent-pink);
            background-color: #ffffff;
            box-shadow: 0 8px 25px rgba(255, 79, 160, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            width: 22px;
            height: 22px;
            fill: var(--text-secondary);
            pointer-events: none;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-top: 40px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            padding-bottom: 10px;
        }

        .section-header:first-of-type {
            margin-top: 10px;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text-primary);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 22px;
        }

        /* Cartes */
        .card {
            background-color: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--card-border);
            transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 20px 40px rgba(255, 79, 160, 0.18);
            border-color: var(--accent-pink);
        }

        .card-img-wrapper {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 12px;
            background-color: #eaeaea;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
            position: relative;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .card:hover img {
            transform: scale(1.06);
        }

        .card-title {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-primary);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            font-size: 0.75rem;
        }

        .card-date {
            color: var(--accent-pink);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        /* Style spécifique pour les cartes artistes (rondes) */
        .card.artist-card .card-img-wrapper {
            border-radius: 50%;
        }

        .card.artist-card {
            text-align: center;
        }

        .info-text {
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-weight: 500;
            grid-column: 1 / -1;
            padding: 10px 0;
            font-style: italic;
        }

        .hidden {
            display: none !important;
        }

        /* Adaptations pour mobile */
        @media (max-width: 768px) {
            .main-content {
                margin-left: 0;
                padding: 70px 16px 160px 16px;
            }

            h1 {
                font-size: 1.8rem;
                margin-bottom: 18px;
            }

            .search-bar-container {
                margin-bottom: 20px;
            }

            .search-input {
                padding: 14px 16px 14px 44px;
                font-size: 0.95rem;
                border-radius: 12px;
            }

            .search-icon {
                left: 14px;
                width: 18px;
                height: 18px;
            }

            .section-header {
                margin-top: 25px;
                margin-bottom: 14px;
            }

            h2 {
                font-size: 1.25rem;
            }

            .grid-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .card {
                padding: 10px;
                border-radius: 14px;
            }

            .card-title {
                font-size: 0.88rem;
            }

            .card-subtitle {
                font-size: 0.78rem;
            }

            .card-meta {
                font-size: 0.7rem;
            }
        }

        @media (max-width: 380px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div id="sidebar-container"></div>
    <div id="player-container"></div>

    <main class="main-content">
        <h1>Recherche</h1>

        <div class="search-bar-container">
            <svg class="search-icon" viewBox="0 0 24 24">
                <path
                    d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
            </svg>
            <input type="text" id="searchInput" class="search-input"
                placeholder="Rechercher un artiste ou une sortie..." autocomplete="off">
        </div>

        <!-- Les sections sont masquées par défaut -->
        <div id="artistsSection" class="search-section hidden">
            <div class="section-header">
                <h2>🎤 Artistes</h2>
            </div>
            <div id="artists-grid" class="grid-container"></div>
        </div>

        <div id="releasesSection" class="search-section hidden">
            <div class="section-header">
                <h2>🎵 Sorties</h2>
            </div>
            <div id="releases-grid" class="grid-container"></div>
        </div>
    </main>

    <script src="/assets/sidebar/sidebar.js"></script>
    <script src="/assets/player/player.js"></script>

    <script>
        const API_WORKER = "https://api.worker.mm-cp.uk";
        let allDirectReleases = [];
        let validArtists = [];

        function getMediaUrl(url) {
            if (!url) return '/assets/img/icon/logo.svg';
            if (url.startsWith('http://') || url.startsWith('https://')) return url;
            const cleanPath = url.startsWith('/') ? url.slice(1) : url;
            return `${API_WORKER}/api/files/${cleanPath}`;
        }

        async function fetchSearchData() {
            try {
                const [releasesRes, artistsRes] = await Promise.all([
                    fetch(`${API_WORKER}/api/releases`).then(res => res.json()),
                    fetch(`${API_WORKER}/api/artists`).then(res => res.json())
                ]);

                const releases = releasesRes.releases || releasesRes || [];
                const artists = artistsRes.artists || artistsRes || [];

                // Ne garder que les sorties ayant le statut "direct"
                allDirectReleases = releases.filter(rel => (rel.status || "").toLowerCase() === "direct");

                // Identifier les artistes ayant au moins une sortie au statut "direct"
                const activeArtistNames = new Set(allDirectReleases.map(rel => (rel.artistName || "").trim().toLowerCase()));
                validArtists = artists.filter(art => activeArtistNames.has((art.name || "").trim().toLowerCase()));

            } catch (err) {
                console.error("Erreur lors de la récupération des données :", err);
            }
        }

        // Gestion de la saisie dans la barre de recherche
        document.getElementById("searchInput").addEventListener("input", (e) => {
            const query = e.target.value.trim().toLowerCase();
            const artistsSection = document.getElementById("artistsSection");
            const releasesSection = document.getElementById("releasesSection");
            const artistsGrid = document.getElementById("artists-grid");
            const releasesGrid = document.getElementById("releases-grid");

            // Si la barre est vide, on masque tout
            if (!query) {
                artistsSection.classList.add("hidden");
                releasesSection.classList.add("hidden");
                artistsGrid.innerHTML = "";
                releasesGrid.innerHTML = "";
                return;
            }

            // Filtrage des artistes valides
            const filteredArtists = validArtists.filter(art =>
                (art.name || "").toLowerCase().includes(query) ||
                (art.primaryGenre || "").toLowerCase().includes(query)
            );

            // Filtrage des sorties directes
            const filteredReleases = allDirectReleases.filter(rel =>
                (rel.title || "").toLowerCase().includes(query) ||
                (rel.artistName || "").toLowerCase().includes(query)
            );

            // Affichage ou masquage de la section Artistes
            if (filteredArtists.length > 0) {
                artistsGrid.innerHTML = filteredArtists.map(art => `
                    <div class="card artist-card" onclick="window.location.href='artiste.html?id=${art.id || encodeURIComponent(art.name)}'">
                        <div class="card-img-wrapper">
                            <img src="${getMediaUrl(art.photo || art.logoUrl)}" alt="${art.name}" loading="lazy">
                        </div>
                        <div class="card-title" title="${art.name}">${art.name}</div>
                        <div class="card-subtitle">${art.primaryGenre || 'Musique'}</div>
                    </div>
                `).join("");
                artistsSection.classList.remove("hidden");
            } else {
                artistsSection.classList.add("hidden");
            }

            // Affichage ou masquage de la section Sorties
            if (filteredReleases.length > 0) {
                releasesGrid.innerHTML = filteredReleases.map(rel => `
                    <div class="card" onclick="window.location.href='sortie.html?id=${rel.id}'">
                        <div class="card-img-wrapper">
                            <img src="${getMediaUrl(rel.coverUrl)}" alt="${rel.title}" loading="lazy">
                        </div>
                        <div class="card-title" title="${rel.title}">${rel.title}</div>
                        <div class="card-subtitle" title="${rel.artistName}">${rel.artistName || 'Artiste inconnu'}</div>
                        <div class="card-meta">
                            <span class="card-date">📅 ${rel.releaseDate || 'Récent'}</span>
                        </div>
                    </div>
                `).join("");
                releasesSection.classList.remove("hidden");
            } else {
                releasesSection.classList.add("hidden");
            }
        });

        fetchSearchData();
    </script>
</body>

</html>
