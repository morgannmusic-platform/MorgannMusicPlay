<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-meta-title">Morgann Music Play - Sortie</title>

    <!-- Balises Open Graph / SEO dynamiques pour le partage -->
    <meta property="og:type" content="music.album" id="og-type">
    <meta property="og:title" content="Sortie musicale - Morgann Music CP" id="og-title">
    <meta property="og:description" content="Découvrez cette sortie en haute qualité sur le label Morgann Music CP."
        id="og-description">
    <meta property="og:image" content="" id="og-image">
    <meta property="og:audio" content="" id="og-audio">
    <meta property="og:site_name" content="Morgann Music CP">

    <!-- Schéma.org JSON-LD dynamique -->
    <script type="application/ld+json" id="schemaOrgData"></script>

    <!-- Color Thief pour extraire les couleurs de la pochette -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.umd.js"></script>
    <!-- CSS de la sidebar -->
    <link rel="stylesheet" href="/assets/sidebar/sidebar.css">
    <!-- CSS du lecteur flottant -->
    <link rel="stylesheet" href="/assets/player/player.css">
    <style>
        :root {
            --bg-primary: #FFF9F2;
            --accent-dynamic: #FF4FA0;
            --text-primary: #1d1d1f;
            --text-secondary: #6e6e73;
            --card-bg: rgba(255, 255, 255, 0.88);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.8s ease;
        }

        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 60px 50px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            min-height: 100vh;
            padding-bottom: 150px;
            transition: margin-left 0.3s ease;
            position: relative;
        }

        /* Bannière mobile pochette masquée sur ordinateur */
        .mobile-cover-banner {
            display: none;
        }

        /* En-tête de la sortie */
        .release-hero {
            display: flex;
            align-items: flex-end;
            gap: 40px;
            margin-bottom: 40px;
            position: relative;
            z-index: 1;
        }

        .cover-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: flex-start;
            flex-shrink: 0;
        }

        .cover-container {
            width: 280px;
            height: 280px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
            background-color: #ddd;
            position: relative;
        }

        .cover-container img,
        .cover-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn-share {
            background: rgba(0, 0, 0, 0.08);
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
            transition: background 0.2s, transform 0.2s;
            width: 100%;
            justify-content: center;
        }

        .btn-share:hover {
            background: rgba(0, 0, 0, 0.15);
            transform: translateY(-2px);
        }

        .btn-share-mobile {
            display: none;
        }

        .release-info {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .release-type {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent-dynamic);
            margin-bottom: 8px;
            transition: color 0.5s ease;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
            line-height: 1.1;
            color: var(--text-primary);
        }

        .artist-name {
            font-size: 1.4rem;
            font-weight: 600;
            opacity: 0.85;
            margin-bottom: 12px;
            cursor: pointer;
            display: inline-block;
            transition: opacity 0.2s;
        }

        .artist-name:hover {
            opacity: 1;
            color: var(--accent-dynamic);
            text-decoration: underline;
        }

        .meta-badges {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        /* Badge Dolby Atmos fortement agrandi sur ordinateur */
        .dolby-icon {
            height: 52px;
            width: auto;
            object-fit: contain;
        }

        .release-year {
            font-size: 1.1rem;
            opacity: 0.85;
            font-weight: 600;
        }

        /* Section Tracklist */
        .tracklist-section {
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 24px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .track-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            border-radius: 14px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
            position: relative;
        }

        .track-item:hover {
            background: rgba(0, 0, 0, 0.05);
            transform: translateX(4px);
        }

        .track-left {
            display: flex;
            align-items: center;
            gap: 16px;
            min-width: 0;
            flex: 1;
        }

        .track-number {
            font-size: 0.95rem;
            font-weight: 600;
            opacity: 0.5;
            width: 24px;
            text-align: center;
            flex-shrink: 0;
        }

        .track-title {
            font-size: 1.05rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-right {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-shrink: 0;
        }

        .track-duration {
            font-size: 0.9rem;
            opacity: 0.6;
        }

        .btn-track-menu {
            background: transparent;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.5;
            padding: 5px 8px;
            border-radius: 8px;
            transition: opacity 0.2s, background 0.2s;
        }

        .track-item:hover .btn-track-menu {
            opacity: 1;
        }

        .btn-track-menu:hover {
            background: rgba(0, 0, 0, 0.08);
        }

        /* Menu contextuel */
        .context-menu {
            position: absolute;
            right: 30px;
            top: 50px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
            padding: 6px;
            z-index: 100;
            display: none;
            min-width: 190px;
            border: 1px solid rgba(0, 0, 0, 0.06);
        }

        .context-menu.active {
            display: block;
        }

        .context-menu-item {
            padding: 10px 12px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #333;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.1s, color 0.1s;
        }

        .context-menu-item:hover {
            background: rgba(0, 0, 0, 0.06);
            color: var(--accent-dynamic);
        }

        /* Infos bas de page */
        .release-footer-info {
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 20px;
            padding: 25px 30px;
            font-size: 0.95rem;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            position: relative;
            z-index: 1;
        }

        .release-footer-info p {
            line-height: 1.5;
        }

        /* Modale de partage */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: #fff;
            padding: 30px;
            border-radius: 24px;
            width: 500px;
            max-width: 90%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-card h3 {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .modal-card label {
            font-size: 0.85rem;
            font-weight: 600;
            opacity: 0.7;
            margin-bottom: 4px;
            display: block;
        }

        .modal-card input,
        .modal-card textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 0.85rem;
            background: #f9f9f9;
            resize: none;
        }

        .modal-close {
            align-self: flex-end;
            background: none;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--accent-dynamic);
        }

        .loading-container,
        .error-container {
            text-align: center;
            padding: 60px;
            font-size: 1.1rem;
            opacity: 0.7;
        }

        /* Adaptations pour mobile */
        @media (max-width: 768px) {
            .main-content {
                margin-left: 0;
                padding: 0 0 160px 0;
            }

            /* Bannière mobile : fondu baissé (image lisible plus bas avant de s'estomper) */
            .mobile-cover-banner {
                display: block;
                width: 100%;
                height: 420px;
                position: relative;
                overflow: hidden;
                margin: 0;
            }

            .mobile-cover-media {
                width: 100%;
                height: 100%;
                object-fit: cover;
                filter: brightness(0.96);
                -webkit-mask-image: radial-gradient(ellipse 150% 90% at 50% 0%, #000 45%, transparent 100%);
                mask-image: radial-gradient(ellipse 150% 90% at 50% 0%, #000 45%, transparent 100%);
            }

            .release-hero {
                padding: 0 16px;
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 10px;
                margin-top: -110px;
                margin-bottom: 25px;
            }

            .cover-container,
            .btn-share-desktop {
                display: none !important;
            }

            .btn-share-mobile {
                display: inline-flex !important;
                width: auto;
                padding: 6px 14px;
                font-size: 0.8rem;
                border-radius: 10px;
                margin: 6px 0 10px 0;
                gap: 6px;
            }

            .release-info {
                align-items: center;
                justify-content: center;
            }

            h1 {
                font-size: 2.1rem;
                margin-bottom: 4px;
            }

            .artist-name {
                font-size: 1.15rem;
                margin-bottom: 2px;
            }

            .meta-badges {
                justify-content: center;
            }

            /* Badge Dolby Atmos agrandi sur mobile */
            .dolby-icon {
                height: 46px;
            }

            .tracklist-section,
            .release-footer-info {
                margin-left: 16px;
                margin-right: 16px;
            }

            .tracklist-section {
                padding: 18px 14px;
                border-radius: 18px;
            }

            .track-item {
                padding: 12px 10px;
            }

            .track-title {
                font-size: 0.92rem;
            }

            .release-footer-info {
                padding: 18px 20px;
                border-radius: 16px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>

<body>

    <div id="sidebar-container"></div>
    <div id="player-container"></div>

    <main class="main-content" id="main-container">
        <div id="content-loader" class="loading-container">Chargement de la sortie...</div>
    </main>

    <!-- Modale de partage -->
    <div class="modal-overlay" id="share-modal">
        <div class="modal-card">
            <button class="modal-close" onclick="closeShareModal()">Fermer</button>
            <h3>Partager cette sortie</h3>
            <div>
                <label>Lien direct</label>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="share-link-input" readonly>
                    <button class="btn-share" style="width: auto; margin:0;" onclick="copyDirectLink()">Copier</button>
                </div>
            </div>
            <div>
                <label>Code d'intégration Iframe (Lecteur Widget)</label>
                <textarea id="share-iframe-input" rows="3" readonly></textarea>
                <button class="btn-share" style="margin-top: 6px;" onclick="copyIframeCode()">Copier le code</button>
            </div>
        </div>
    </div>

    <script src="/assets/sidebar/sidebar.js"></script>
    <script src="/assets/player/player.js"></script>

    <script>
        const API_WORKER = "https://api.worker.mm-cp.uk";

        function getMediaUrl(url) {
            if (!url) return '';
            if (url.startsWith('http://') || url.startsWith('https://')) {
                return `${API_WORKER}/api/proxy-download?url=${encodeURIComponent(url)}`;
            }
            const cleanPath = url.startsWith('/') ? url.slice(1) : url;
            return `${API_WORKER}/api/files/${cleanPath}`;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const releaseId = urlParams.get('id');

        async function loadReleaseDetails() {
            const container = document.getElementById('main-container');

            if (!releaseId) {
                container.innerHTML = `<div class="error-container">Aucune sortie spécifiée.</div>`;
                return;
            }

            try {
                const res = await fetch(`${API_WORKER}/api/releases/${releaseId}`);
                if (!res.ok) throw new Error("Sortie introuvable");
                const release = await res.json();

                const rawCoverUrl = release.animatedCoverUrl || release.coverUrl;
                const coverSrc = getMediaUrl(rawCoverUrl);
                const staticCoverSrc = getMediaUrl(release.coverUrl || release.animatedCoverUrl);
                const isAnimated = rawCoverUrl && (rawCoverUrl.endsWith('.mp4') || rawCoverUrl.endsWith('.mov'));

                const releaseTitleText = `${release.title} - ${release.artistName || 'Artiste'}`;
                const releaseDescText = `Découvrez ${release.title} par ${release.artistName || 'Artiste'} sur Morgann Music CP.`;

                document.getElementById('page-meta-title').innerText = releaseTitleText;
                document.getElementById('og-title').setAttribute('content', releaseTitleText);
                document.getElementById('og-description').setAttribute('content', releaseDescText);
                document.getElementById('og-image').setAttribute('content', window.location.origin + staticCoverSrc);

                // Injection dynamique du schéma JSON-LD depuis la BDD (schema_json ou schemaJson)
                const schemaTag = document.getElementById('schemaOrgData');
                const customSchema = release.schema_json || release.schemaJson;

                if (customSchema) {
                    try {
                        const schemaObj = typeof customSchema === 'string' ? JSON.parse(customSchema) : customSchema;
                        schemaTag.textContent = JSON.stringify(schemaObj, null, 2);
                    } catch (e) {
                        console.warn("Erreur parsing schema_json sortie, repli sur le schéma par défaut :", e);
                        const defaultSchema = {
                            "@context": "https://schema.org",
                            "@type": "MusicAlbum",
                            "name": release.title || "Sortie",
                            "url": window.location.href,
                            "image": window.location.origin + staticCoverSrc,
                            "description": releaseDescText,
                            "byArtist": {
                                "@type": "MusicGroup",
                                "name": release.artistName || "Artiste"
                            }
                        };
                        schemaTag.textContent = JSON.stringify(defaultSchema, null, 2);
                    }
                } else {
                    const defaultSchema = {
                        "@context": "https://schema.org",
                        "@type": "MusicAlbum",
                        "name": release.title || "Sortie",
                        "url": window.location.href,
                        "image": window.location.origin + staticCoverSrc,
                        "description": releaseDescText,
                        "byArtist": {
                            "@type": "MusicGroup",
                            "name": release.artistName || "Artiste"
                        }
                    };
                    schemaTag.textContent = JSON.stringify(defaultSchema, null, 2);
                }

                const tracks = release.tracks || [];
                if (tracks.length > 0 && tracks[0].fileUrl) {
                    const primaryAudioWavUrl = window.location.origin + getMediaUrl(tracks[0].fileUrl);
                    document.getElementById('og-audio').setAttribute('content', primaryAudioWavUrl);
                }

                let releaseYear = release.releaseDate ? release.releaseDate.split('-')[0] : '';
                let formattedLongDate = release.releaseDate || 'Date non spécifiée';
                if (release.releaseDate && release.releaseDate.includes('-')) {
                    try {
                        const dateObj = new Date(release.releaseDate);
                        formattedLongDate = dateObj.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
                    } catch (e) { }
                }

                const artistName = release.artistName || 'Artiste inconnu';

                container.innerHTML = `
                    <div class="mobile-cover-banner">
                        ${isAnimated
                        ? `<video src="${coverSrc}" autoplay loop muted playsinline crossorigin="anonymous" class="mobile-cover-media" id="source-media-mobile"></video>`
                        : `<img src="${coverSrc}" alt="${release.title}" crossorigin="anonymous" class="mobile-cover-media" id="source-media-mobile">`
                    }
                    </div>

                    <div class="release-hero">
                        <div class="cover-wrapper">
                            <div class="cover-container" id="cover-box">
                                ${isAnimated
                        ? `<video src="${coverSrc}" autoplay loop muted playsinline crossorigin="anonymous" id="source-media"></video>`
                        : `<img src="${coverSrc}" alt="${release.title}" crossorigin="anonymous" id="source-media">`
                    }
                            </div>
                            <button class="btn-share btn-share-desktop" onclick="openShareModal()">🔗 Partager / Intégrer</button>
                        </div>
                        <div class="release-info">
                            <span class="release-type">${release.type || 'Single'}</span>
                            <h1 id="release-title">${release.title}</h1>
                            <div class="artist-name" onclick="goToArtist('${artistName.replace(/'/g, "\\'")}')">${artistName}</div>
                            
                            <button class="btn-share btn-share-mobile" onclick="openShareModal()">🔗 Partager / Intégrer</button>
                            
                            <div class="meta-badges">
                                ${release.dolbyAtmos ? '<img src="/assets/img/icon/dolby.png" alt="Dolby Atmos" class="dolby-icon">' : ''}
                                <span class="release-year">${releaseYear}</span>
                            </div>
                        </div>
                    </div>

                    <div class="tracklist-section" id="tracklist-box">
                        <h2>Morceaux</h2>
                        <div id="tracks-list"></div>
                    </div>

                    <div class="release-footer-info">
                        <p>📅 ${formattedLongDate}</p>
                        <p>🎵 ${tracks.length} piste${tracks.length > 1 ? 's' : ''}</p>
                        <p>℗ ${release.copyrightLineP || 'Morgann Music CP'}</p>
                        <p>© ${release.copyrightLineC || artistName || 'Morgann Music CP'}</p>
                        <p>Label : <strong>${release.labelName || 'Morgann Music CP'}</strong></p>
                    </div>
                `;

                const tracksContainer = document.getElementById('tracks-list');

                if (tracks.length === 0) {
                    tracksContainer.innerHTML = `<p style="opacity: 0.6; font-style: italic;">Aucune piste audio disponible pour cette sortie.</p>`;
                } else {
                    tracksContainer.innerHTML = tracks.map((track, index) => {
                        const trackFileUrl = getMediaUrl(track.fileUrl || track.url);
                        const trackTitle = track.title || release.title;

                        return `
                            <div class="track-item" onclick="triggerPlay('${trackTitle.replace(/'/g, "\\'")}', '${artistName.replace(/'/g, "\\'")}', '${trackFileUrl}', '${staticCoverSrc}')" oncontextmenu="openContextMenu(event, ${index})">
                                <div class="track-left">
                                    <span class="track-number">${index + 1}</span>
                                    <span class="track-title">${trackTitle}</span>
                                </div>
                                <div class="track-right">
                                    <div class="track-duration">${track.duration || ''}</div>
                                    <button class="btn-track-menu" onclick="event.stopPropagation(); toggleContextMenu(event, ${index})">⋮</button>
                                </div>
                                <div class="context-menu" id="ctx-menu-${index}">
                                    <div class="context-menu-item" onclick="actionQueue(event, '${trackTitle.replace(/'/g, "\\'")}')">Lire en suite</div>
                                </div>
                            </div>
                        `;
                    }).join("");
                }

                document.addEventListener('click', () => {
                    document.querySelectorAll('.context-menu').forEach(m => m.classList.remove('active'));
                });

                const mediaElement = document.getElementById('source-media') || document.getElementById('source-media-mobile');
                if (mediaElement) {
                    const applyThemeFromElement = (el) => {
                        try {
                            let imgTarget = el;
                            if (el.tagName === 'VIDEO') {
                                const canvas = document.createElement('canvas');
                                canvas.width = el.videoWidth || 300;
                                canvas.height = el.videoHeight || 300;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(el, 0, 0, canvas.width, canvas.height);
                                imgTarget = canvas;
                            }

                            const colorThief = new ColorThief();
                            const palette = colorThief.getPalette(imgTarget, 2);
                            if (palette && palette.length > 0) {
                                const [r, g, b] = palette[0];

                                const mixR = Math.round(r * 0.35 + 255 * 0.65);
                                const mixG = Math.round(g * 0.35 + 249 * 0.65);
                                const mixB = Math.round(b * 0.35 + 242 * 0.65);
                                const solidColor = `rgb(${mixR}, ${mixG}, ${mixB})`;
                                const accentColor = `rgb(${r}, ${g}, ${b})`;

                                document.documentElement.style.setProperty('--accent-dynamic', accentColor);
                                document.body.style.backgroundColor = solidColor;

                                const sidebar = document.querySelector('.sidebar');
                                if (sidebar) {
                                    sidebar.style.background = `rgba(255, 255, 255, 0.92)`;
                                    sidebar.style.backdropFilter = 'blur(25px)';
                                }

                                let dynamicStyleTag = document.getElementById('dynamic-sidebar-style');
                                if (!dynamicStyleTag) {
                                    dynamicStyleTag = document.createElement('style');
                                    dynamicStyleTag.id = 'dynamic-sidebar-style';
                                    document.head.appendChild(dynamicStyleTag);
                                }
                                dynamicStyleTag.innerHTML = `
                                    .sidebar a.active, .sidebar .nav-item.active {
                                        background-color: rgba(${r}, ${g}, ${b}, 0.2) !important;
                                        color: ${accentColor} !important;
                                    }
                                    .sidebar a:hover {
                                        background-color: rgba(0, 0, 0, 0.04) !important;
                                        color: ${accentColor} !important;
                                    }
                                `;
                            }
                        } catch (e) {
                            console.log("Color Thief extraction ignorée :", e);
                        }
                    };

                    if (mediaElement.tagName === 'IMG') {
                        if (mediaElement.complete) applyThemeFromElement(mediaElement);
                        else mediaElement.onload = () => applyThemeFromElement(mediaElement);
                    } else if (mediaElement.tagName === 'VIDEO') {
                        mediaElement.onloadeddata = () => applyThemeFromElement(mediaElement);
                    }
                }

            } catch (err) {
                console.error("Erreur chargement sortie :", err);
                container.innerHTML = `<div class="error-container">Impossible de charger les détails de cette sortie.</div>`;
            }
        }

        function goToArtist(artistName) {
            window.location.href = `artiste.html?name=${encodeURIComponent(artistName)}`;
        }

        function triggerPlay(title, artist, url, cover) {
            if (!url) {
                alert("Fichier audio non disponible pour cette piste.");
                return;
            }
            if (window.mmPlayTrack) {
                window.mmPlayTrack({
                    title: title,
                    artist: artist,
                    url: url,
                    cover: cover
                });
            }
        }

        function toggleContextMenu(event, index) {
            event.stopPropagation();
            const menu = document.getElementById(`ctx-menu-${index}`);
            const isOpen = menu.classList.contains('active');
            document.querySelectorAll('.context-menu').forEach(m => m.classList.remove('active'));
            if (!isOpen) {
                menu.classList.add('active');
            }
        }

        function openContextMenu(event, index) {
            event.preventDefault();
            event.stopPropagation();
            document.querySelectorAll('.context-menu').forEach(m => m.classList.remove('active'));
            const menu = document.getElementById(`ctx-menu-${index}`);
            if (menu) menu.classList.add('active');
        }

        function actionQueue(e, title) {
            e.stopPropagation();
            alert(`"${title}" a été ajouté à la file d'attente.`);
        }
        function openShareModal() {
            const currentUrl = window.location.href;
            const releaseTitle = document.getElementById('release-title')?.innerText || 'Sortie musicale';

            document.getElementById('share-link-input').value = currentUrl;

            const iframeCode = `<iframe src="${currentUrl}" width="100%" height="500" style="border:none;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.15);" allow="encrypted-media" title="${releaseTitle}"></iframe>`;
            document.getElementById('share-iframe-input').value = iframeCode;

            document.getElementById('share-modal').classList.add('active');
        }

        function closeShareModal() {
            document.getElementById('share-modal').classList.remove('active');
        }

        function copyDirectLink() {
            const input = document.getElementById('share-link-input');
            navigator.clipboard.writeText(input.value);
            alert("Lien direct copié !");
        }

        function copyIframeCode() {
            const textarea = document.getElementById('share-iframe-input');
            navigator.clipboard.writeText(textarea.value);
            alert("Code Iframe widget copié !");
        }

        loadReleaseDetails();
    </script>
</body>

</html>
