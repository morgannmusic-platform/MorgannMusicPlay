<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg-primary: #FFF9F2;
            --accent-pink: #FF4FA0;
            --text-primary: #1d1d1f;
            --text-secondary: #6e6e73;
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(255, 79, 160, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }

        body {
            width: 300px;
            padding: 16px;
            background-color: var(--bg-primary);
            color: var(--text-primary);
        }

        .radio-container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .radio-logo-wrapper {
            width: 110px;
            height: 110px;
            margin-bottom: 14px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(255, 79, 160, 0.25);
            border: 3px solid #ffffff;
            background-color: #eaeaea;
            position: relative;
        }

        .radio-logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .radio-logo-wrapper.playing::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 3px solid var(--accent-pink);
            border-radius: 50%;
            animation: pulse-ring 1.8s infinite cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }

            100% {
                transform: scale(1.25);
                opacity: 0;
            }
        }

        h1 {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            margin-bottom: 4px;
        }

        .radio-subtitle {
            font-size: 0.82rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 16px;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .radio-player-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            width: 100%;
        }

        .play-btn {
            background-color: var(--accent-pink);
            color: #ffffff;
            border: none;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(255, 79, 160, 0.4);
            transition: transform 0.15s ease, background-color 0.2s ease;
        }

        .play-btn:active {
            transform: scale(0.94);
        }

        .play-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            margin-left: 2px;
        }

        .play-btn.isPlaying svg {
            margin-left: 0;
        }

        .radio-status {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent-pink);
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 85%;
            margin-top: 4px;
        }

        .volume-container svg {
            width: 16px;
            height: 16px;
            fill: var(--text-secondary);
        }

        .volume-slider {
            flex: 1;
            accent-color: var(--accent-pink);
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="radio-container">
        <div class="radio-logo-wrapper" id="logoWrapper">
            <img src="https://mm-cp.uk/assets/img/icons/sombre.png" alt="Radio Logo" id="radioCover">
        </div>

        <h1>Morgann Music Radio</h1>
        <div class="radio-subtitle" id="radioStatusText">Chargement du direct...</div>

        <div class="radio-player-box">
            <button class="play-btn" id="playBtn">
                <svg id="playIcon" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z" />
                </svg>
            </button>
            <div class="radio-status" id="liveIndicator">Statique</div>

            <div class="volume-container">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
                </svg>
                <input type="range" min="0" max="1" step="0.01" value="1" class="volume-slider" id="volumeSlider">
            </div>
        </div>
    </div>

    <audio id="radioAudio" crossorigin="anonymous"></audio>
    <script src="popup.js"></script>
</body>

</html>
